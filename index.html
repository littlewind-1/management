<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VL르웨스트종합관리시스템</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --fg: #0f172a;
    --mut: #64748b;
    --ln: #cbd5e1;
    --ln-dark: #94a3b8;
    --hd: #e8eef7;
    --hd2: #f1f5f9;
    --bl: #1f5fbf;
    --bl-hover: #174996;
    --ok: #15803d;
    --ok-hover: #116630;
    --bad: #dc2626;
    --sel: rgba(31, 95, 191, 0.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    font-size: 13.5px;
    line-height: 1.4;
  }
  .container {
    max-width: 1360px;
    margin: 0 auto;
    padding: 16px;
  }

  /* 상단 헤더: 좌상단 제목 크게 + 날짜/저장/불러오기/인쇄 */
  .top-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border: 1.5px solid var(--ln-dark);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  }
  .main-title {
    margin: 0;
    font-size: clamp(24px, 3vw, 32px);
    font-weight: 900;
    letter-spacing: -0.03em;
    color: var(--bl);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .main-title .badge-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--bl);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
  }
  .top-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .ctrl-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--hd2);
    border: 1px solid var(--ln);
    border-radius: 8px;
    padding: 5px 9px;
  }
  .ctrl-group label {
    font-weight: 700;
    color: #334155;
    font-size: 12.5px;
    white-space: nowrap;
  }
  input, select, textarea, button {
    font: inherit;
  }
  input[type="date"], input[type="text"], select {
    border: 1px solid var(--ln);
    border-radius: 6px;
    padding: 5px 8px;
    background: #fff;
    color: var(--fg);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--bl);
    box-shadow: 0 0 0 2px rgba(31, 95, 191, 0.18);
  }
  button {
    border: 1px solid var(--ln-dark);
    border-radius: 7px;
    padding: 6px 12px;
    background: #fff;
    color: var(--fg);
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.08s ease, background-color 0.15s, filter 0.15s;
    user-select: none;
  }
  button:hover { filter: brightness(0.96); }
  button:active { transform: scale(0.96) translateY(1px); }
  button.pri {
    background: var(--bl);
    color: #fff;
    border-color: var(--bl);
  }
  button.pri:hover { background: var(--bl-hover); filter: none; }
  button.ok {
    background: var(--ok);
    color: #fff;
    border-color: var(--ok);
  }
  button.ok:hover { background: var(--ok-hover); filter: none; }
  button.danger {
    background: #fef2f2;
    color: var(--bad);
    border-color: #fecaca;
  }
  button.sm {
    padding: 4px 9px;
    font-size: 12.5px;
  }
  .day-pill {
    font-weight: 800;
    color: var(--bl);
    background: #dbeafe;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 12px;
  }

  /* 카드 블록 */
  .card {
    background: var(--card);
    border: 1.5px solid var(--ln-dark);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
  }

  /* 관리부서 / 관리자 / 현재 관리자 테이블 */
  table.grid-form {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.grid-form th, table.grid-form td {
    border: 1px solid var(--ln-dark);
    padding: 6px 8px;
    vertical-align: middle;
  }
  table.grid-form th {
    background: var(--hd);
    font-weight: 800;
    text-align: center;
    color: #1e293b;
  }
  .inline-flex-cell {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .inline-flex-cell input, .inline-flex-cell select {
    flex: 1;
    min-width: 0;
  }

  /* 현재 관리자 표시 바 */
  .cur-mgr-bar {
    display: grid;
    grid-template-columns: 140px 1fr 1fr 1fr;
    border: 1.5px solid var(--bl);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 10px;
    background: #f8fbff;
  }
  .cur-mgr-bar .lbl {
    background: var(--bl);
    color: #fff;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  .cur-mgr-bar .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-left: 1px solid var(--ln);
  }
  .cur-mgr-bar .item span.k {
    font-weight: 800;
    color: var(--mut);
    font-size: 12px;
    white-space: nowrap;
  }
  .cur-mgr-bar .item input {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    font-weight: 800;
    color: var(--fg);
    padding: 3px 6px;
  }
  .cur-mgr-bar .item input:focus {
    background: #fff;
    border-color: var(--bl);
  }

  /* 내용입력 섹션 */
  table.entry-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.entry-table th, table.entry-table td {
    border: 1px solid var(--ln-dark);
    padding: 6px 8px;
    vertical-align: middle;
  }
  table.entry-table th.side-title {
    background: var(--hd);
    font-size: 16px;
    font-weight: 900;
    text-align: center;
    color: #0f172a;
    width: 130px;
  }
  table.entry-table th.sub-lbl {
    background: var(--hd2);
    font-weight: 800;
    text-align: center;
    width: 140px;
    color: #1e293b;
  }
  table.entry-table td.reg-action-cell {
    width: 190px;
    text-align: center;
    background: #f8fafc;
    padding: 10px;
  }
  .btn-register-big {
    width: 100%;
    height: 100%;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 16px;
    font-weight: 900;
    border-radius: 10px;
    background: var(--bl);
    color: #fff;
    border: none;
    box-shadow: 0 3px 8px rgba(31, 95, 191, 0.25);
  }
  .btn-register-big:hover { background: var(--bl-hover); filter: none; }
  .btn-register-big small {
    font-size: 11.5px;
    font-weight: 500;
    opacity: 0.9;
  }
  .entry-table textarea {
    width: 100%;
    border: 1px solid var(--ln);
    border-radius: 6px;
    padding: 6px 8px;
    resize: vertical;
    min-height: 44px;
    background: #fff;
    color: var(--fg);
  }

  /* 하단 리스트 툴바 (찾기, 원래대로, 채우기, 글자색, 테두리, 실행취소, 행추가) */
  .list-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    background: var(--hd2);
    border: 1px solid var(--ln-dark);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
  }
  .toolbar-left, .toolbar-right {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .search-box {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #fff;
    border: 1px solid var(--ln-dark);
    border-radius: 7px;
    padding: 3px 6px;
  }
  .search-box input {
    border: none;
    box-shadow: none !important;
    padding: 3px 5px;
    width: 220px;
  }
  .style-tool {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 1px solid var(--ln);
    border-radius: 7px;
    padding: 3px 7px;
    font-size: 12.5px;
    font-weight: 700;
  }
  .style-tool input[type="color"] {
    width: 22px;
    height: 22px;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
  }
  .filter-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: #fef9c3;
    border: 1px solid #facc15;
    border-bottom: none;
    padding: 6px 12px;
    font-weight: 700;
    color: #854d0e;
    font-size: 13px;
  }
  .filter-banner.active {
    display: flex;
  }

  /* 메인 스프레드시트 리스트 테이블 */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--ln-dark);
    border-radius: 0 0 8px 8px;
    background: #fff;
  }
  table.sheet-table {
    width: 100%;
    min-width: 1020px;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.sheet-table th, table.sheet-table td {
    border-right: 1px solid var(--ln-dark);
    border-bottom: 1px solid var(--ln-dark);
    padding: 0;
    text-align: center;
    height: 32px;
    position: relative;
  }
  table.sheet-table th:last-child, table.sheet-table td:last-child {
    border-right: none;
  }
  table.sheet-table tbody tr:last-child td {
    border-bottom: none;
  }
  table.sheet-table th {
    background: var(--hd);
    font-weight: 800;
    font-size: 13px;
    padding: 6px 4px;
    color: #0f172a;
    user-select: none;
  }
  table.sheet-table td.seq-cell {
    background: #f8fafc;
    font-weight: 700;
    color: var(--mut);
    font-size: 12.5px;
    user-select: none;
  }
  table.sheet-table td.selected {
    background-color: var(--sel) !important;
    box-shadow: inset 0 0 0 2px var(--bl);
  }
  .cell-editor {
    width: 100%;
    height: 100%;
    min-height: 31px;
    border: none;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 5px 6px;
    outline: none;
    resize: none;
    overflow: hidden;
    display: block;
    line-height: 1.35;
  }
  .cell-editor.tc { text-align: center; }
  .cell-editor.tl { text-align: left; }
  .cell-editor:focus {
    background: rgba(59, 130, 246, 0.08);
    box-shadow: inset 0 0 0 2px var(--bl);
  }
  .btn-row-del {
    padding: 3px 8px;
    font-size: 12px;
    border-radius: 5px;
    background: #fff;
    color: #dc2626;
    border: 1px solid #fca5a5;
  }
  .btn-row-del:hover {
    background: #fee2e2;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--mut);
  }
  #status-msg {
    font-weight: 700;
    color: var(--bl);
  }
  #status-msg.err {
    color: var(--bad);
  }

  /* A4 인쇄 스타일 */
  @media print {
    @page {
      size: A4 portrait;
      margin: 10mm;
    }
    html, body {
      background: #fff !important;
      color: #000 !important;
      font-size: 11pt;
    }
    .container {
      max-width: none !important;
      width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .no-print,
    .top-controls,
    #dept-mgr-card,
    #entry-card,
    .list-toolbar,
    .status-bar,
    th.col-del,
    td.col-del {
      display: none !important;
    }
    .top-header {
      border: none !important;
      box-shadow: none !important;
      padding: 0 0 8px 0 !important;
      margin-bottom: 8px !important;
      border-bottom: 2px solid #000 !important;
      border-radius: 0 !important;
    }
    .main-title {
      font-size: 20pt !important;
      color: #000 !important;
    }
    .main-title .badge-logo {
      display: none !important;
    }
    .print-meta {
      display: block !important;
      font-size: 10pt;
      font-weight: 700;
    }
    .card {
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .table-wrap {
      border: 1px solid #000 !important;
      border-radius: 0 !important;
      overflow: visible !important;
    }
    table.sheet-table {
      min-width: 0 !important;
      width: 100% !important;
    }
    table.sheet-table th, table.sheet-table td {
      border: 1px solid #333 !important;
      height: auto !important;
      font-size: 9.5pt !important;
      padding: 3px 4px !important;
    }
    table.sheet-table th {
      background: #e2e8f0 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    table.sheet-table td.selected {
      background-color: transparent !important;
      box-shadow: none !important;
    }
    .cell-editor {
      min-height: 0 !important;
      padding: 0 !important;
      white-space: pre-wrap !important;
      overflow: visible !important;
    }
    tr {
      break-inside: avoid;
      page-break-inside: avoid;
    }
  }
  .print-meta { display: none; }
</style>
</head>
<body>
<div class="container">
  <!-- 상단 타이틀 및 일자별 저장/불러오기/인쇄 -->
  <header class="top-header">
    <h1 class="main-title">
      <span class="badge-logo">VL</span>
      <span>VL르웨스트종합관리시스템</span>
    </h1>
    <div id="print-meta" class="print-meta"></div>
    <div class="top-controls no-print">
      <div class="ctrl-group">
        <label for="work-date">요일선택(기본 TODAY)</label>
        <input type="date" id="work-date" data-nav="top">
        <span id="day-label" class="day-pill">오늘</span>
      </div>
      <button id="btn-day-save" class="ok" data-nav="top">일자별 저장</button>
      <div class="ctrl-group">
        <label for="saved-date-select">저장목록</label>
        <select id="saved-date-select" data-nav="top" style="min-width:145px;"></select>
        <button id="btn-day-load" class="pri sm" data-nav="top">일자별 불러오기</button>
        <button id="btn-day-del" class="danger sm" data-nav="top" title="선택한 저장일자 삭제">삭제</button>
      </div>
      <button id="btn-print" data-nav="top">🖨 인쇄 (A4)</button>
    </div>
  </header>

  <!-- 관리부서 등록/선택 & 관리자 등록/선택 & 현재 관리자 -->
  <section id="dept-mgr-card" class="card no-print">
    <table class="grid-form">
      <colgroup>
        <col style="width:130px;">
        <col style="width:36%;">
        <col style="width:130px;">
        <col>
      </colgroup>
      <tbody>
        <tr>
          <th>관리부서 등록</th>
          <td>
            <div class="inline-flex-cell">
              <input type="text" id="dept-input" placeholder="관리부서명 입력 (예: 하우스키핑, 시설, 보안, 콜센터)" data-nav="top">
              <button id="btn-dept-add" class="pri sm" data-nav="top">등록</button>
            </div>
          </td>
          <th>관리부서 선택</th>
          <td>
            <div class="inline-flex-cell">
              <select id="dept-select" data-nav="top"></select>
              <button id="btn-dept-del" class="danger sm" data-nav="top" title="선택된 관리부서 삭제">삭제</button>
            </div>
          </td>
        </tr>
        <tr>
          <th>관리자 등록</th>
          <td>
            <div class="inline-flex-cell">
              <input type="text" id="mgr-rank-input" placeholder="직책 (예: 팀장)" style="max-width:110px;" data-nav="top">
              <input type="text" id="mgr-name-input" placeholder="관리자 이름 입력" data-nav="top">
              <button id="btn-mgr-add" class="pri sm" data-nav="top">등록</button>
            </div>
          </td>
          <th>관리자 선택</th>
          <td>
            <div class="inline-flex-cell">
              <select id="mgr-select" data-nav="top"></select>
              <button id="btn-mgr-del" class="danger sm" data-nav="top" title="선택된 관리자 삭제">삭제</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="cur-mgr-bar">
      <div class="lbl">현재 관리자</div>
      <div class="item">
        <span class="k">부서명</span>
        <input type="text" id="cur-dept" placeholder="부서 선택 또는 직접 입력" data-nav="top">
      </div>
      <div class="item">
        <span class="k">직책</span>
        <input type="text" id="cur-rank" placeholder="직책 입력" data-nav="top">
      </div>
      <div class="item">
        <span class="k">이름</span>
        <input type="text" id="cur-name" placeholder="관리자 이름 입력" data-nav="top">
      </div>
    </div>
  </section>

  <!-- 내용입력 섹션 -->
  <section id="entry-card" class="card no-print">
    <table class="entry-table">
      <tbody>
        <tr>
          <th rowspan="5" class="side-title">내용입력</th>
          <th class="sub-lbl">동선택</th>
          <td>
            <select id="entry-dong" style="width:140px;" data-nav="entry">
              <option value="A">A동</option>
              <option value="B">B동</option>
              <option value="C">C동</option>
              <option value="D">D동</option>
            </select>
          </td>
          <td rowspan="5" class="reg-action-cell">
            <button id="btn-entry-register" class="btn-register-big" data-nav="entry">
              <span>등록버튼</span>
              <small>(등록 후 공란으로 환원)</small>
            </button>
          </td>
        </tr>
        <tr>
          <th class="sub-lbl">세대번호 입력</th>
          <td>
            <input type="text" id="entry-room" placeholder="예: 305, 1204 등 입력" style="width:100%;" data-nav="entry">
          </td>
        </tr>
        <tr>
          <th class="sub-lbl">날짜/시간 자동입력</th>
          <td>
            <input type="text" id="entry-datetime" style="width:100%; background:#f8fafc; font-weight:700;" data-nav="entry">
          </td>
        </tr>
        <tr>
          <th class="sub-lbl">상담 내용</th>
          <td>
            <textarea id="entry-consult" rows="2" placeholder="상담 내용을 입력하세요 (Alt+Enter 줄바꿈 / Enter 다음 칸 이동)" data-nav="entry"></textarea>
          </td>
        </tr>
        <tr>
          <th class="sub-lbl">조치 내용</th>
          <td>
            <textarea id="entry-action" rows="2" placeholder="조치 내용을 입력하세요 (Alt+Enter 줄바꿈 / Enter 다음 칸 이동)" data-nav="entry"></textarea>
          </td>
        </tr>
      </tbody>
    </table>
  </section>

  <!-- 하단 상담/조치 리스트 -->
  <section class="card">
    <div class="list-toolbar no-print">
      <div class="toolbar-left">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="세대번호, 관리자명, 관리부서명으로 찾기" data-nav="tool">
          <button id="btn-find" class="pri sm" data-nav="tool">찾기</button>
        </div>
        <button id="btn-reset-view" class="sm" data-nav="tool">원래대로</button>
        <button id="btn-add-row" class="ok sm" data-nav="tool">+ 행 추가</button>
      </div>
      <div class="toolbar-right">
        <div class="style-tool" title="선택한 셀 채우기(배경색)">
          <span>채우기</span>
          <input type="color" id="fill-color" value="#fef08a">
          <button id="btn-fill-apply" class="sm" style="padding:2px 6px;">적용</button>
          <button id="btn-fill-clear" class="sm" style="padding:2px 6px;">없음</button>
        </div>
        <div class="style-tool" title="선택한 셀 글자색">
          <span>글자색</span>
          <input type="color" id="font-color" value="#dc2626">
          <button id="btn-font-apply" class="sm" style="padding:2px 6px;">적용</button>
        </div>
        <div class="style-tool" title="선택한 셀 테두리">
          <span>테두리</span>
          <select id="border-style" style="padding:2px 4px; font-size:12px;">
            <option value="2px solid #0f172a">굵게(검정)</option>
            <option value="1px solid #0f172a">보통(검정)</option>
            <option value="2px solid #1f5fbf">파랑 강조</option>
            <option value="2px solid #dc2626">빨강 강조</option>
            <option value="none">테두리 없음</option>
          </select>
          <button id="btn-border-apply" class="sm" style="padding:2px 6px;">적용</button>
        </div>
        <button id="btn-undo" class="sm" data-nav="tool">실행취소</button>
      </div>
    </div>

    <div id="filter-banner" class="filter-banner no-print">
      <span id="filter-banner-text">검색 결과 표시 중</span>
      <button id="btn-banner-reset" class="sm">원래대로 (전체 목록 보기)</button>
    </div>

    <div class="table-wrap">
      <table class="sheet-table" id="list-table">
        <colgroup>
          <col style="width:52px;">
          <col style="width:64px;">
          <col style="width:96px;">
          <col style="width:110px;">
          <col style="width:100px;">
          <col style="width:27%;">
          <col style="width:23%;">
          <col style="width:15%;">
          <col class="col-del" style="width:68px;">
        </colgroup>
        <thead>
          <tr>
            <th>순번</th>
            <th>동</th>
            <th>세대번호</th>
            <th>관리부서</th>
            <th>관리자</th>
            <th>상담 내용</th>
            <th>조치 내용</th>
            <th>기타</th>
            <th class="col-del">삭제</th>
          </tr>
        </thead>
        <tbody id="list-tbody"></tbody>
      </table>
    </div>

    <div class="status-bar no-print">
      <span id="status-msg">준비 완료 (모든 셀에서 방향키 및 Enter 이동 가능)</span>
      <span id="row-count-info">총 10행</span>
    </div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const DAYS_KO = ['일', '월', '화', '수', '목', '금', '토'];

const LS_KEY_STATE = 'vl_total_mgmt_state_v1';
const LS_KEY_DAY_PREFIX = 'vl_total_mgmt_day:';

const COL_KEYS = ['dong', 'room', 'dept', 'mgr', 'consult', 'action', 'etc'];
const CENTER_COLS = new Set(['dong', 'room', 'dept', 'mgr']);

function createEmptyRow() {
  return {
    dong: '',
    room: '',
    dept: '',
    mgr: '',
    consult: '',
    action: '',
    etc: '',
    styles: {}
  };
}

function createDefaultRows(count = 10) {
  return Array.from({ length: count }, () => createEmptyRow());
}

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function formatNowDateTime() {
  const d = new Date();
  const dy = DAYS_KO[d.getDay()];
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} (${dy}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

let state = {
  date: getTodayStr(),
  departments: ['하우스키핑', '시설', '보안', '콜센터'],
  managers: [
    { dept: '하우스키핑', rank: '팀장', name: '이중희' }
  ],
  currentManager: {
    dept: '하우스키핑',
    rank: '팀장',
    name: '이중희'
  },
  rows: createDefaultRows(10)
};

let filterQuery = '';
let undoStack = [];
let selectedCell = { r: 0, c: 0 }; // r: row index in state.rows, c: col index in COL_KEYS

function say(msg, isErr = false) {
  const el = $('#status-msg');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
}

function pushUndo() {
  undoStack.push(JSON.stringify({
    rows: state.rows,
    departments: state.departments,
    managers: state.managers,
    currentManager: state.currentManager
  }));
  if (undoStack.length > 50) undoStack.shift();
}

function saveWorkingState() {
  try {
    localStorage.setItem(LS_KEY_STATE, JSON.stringify(state));
  } catch (e) {}
}

function loadWorkingState() {
  try {
    const raw = localStorage.getItem(LS_KEY_STATE);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.rows)) {
        state = Object.assign(state, parsed);
        if (state.rows.length < 10) {
          while (state.rows.length < 10) state.rows.push(createEmptyRow());
        }
      }
    }
  } catch (e) {}
}

/* 날짜 및 요일 표기 */
function updateDateUI() {
  const val = $('#work-date').value;
  state.date = val;
  if (!val) {
    $('#day-label').textContent = '-';
    return;
  }
  const [y, m, d] = val.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const today = getTodayStr();
  const dy = DAYS_KO[dt.getDay()];
  $('#day-label').textContent = val === today ? `${dy}요일 · TODAY` : `${dy}요일`;
}

/* 일자별 저장 및 불러오기 */
function getSavedDateKeys() {
  const list = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(LS_KEY_DAY_PREFIX)) {
        list.push(k.slice(LS_KEY_DAY_PREFIX.length));
      }
    }
  } catch (e) {}
  return list.sort().reverse();
}

function refreshSavedDateSelect(selectDt) {
  const sel = $('#saved-date-select');
  const dates = getSavedDateKeys();
  if (!dates.length) {
    sel.innerHTML = '<option value="">저장된 일자 없음</option>';
    return;
  }
  sel.innerHTML = dates.map(dt => {
    const [y, m, d] = dt.split('-').map(Number);
    const dy = (y && m && d) ? DAYS_KO[new Date(y, m - 1, d).getDay()] : '';
    return `<option value="${dt}">${dt}${dy ? ' (' + dy + ')' : ''}</option>`;
  }).join('');
  if (selectDt && dates.includes(selectDt)) {
    sel.value = selectDt;
  } else if (dates.includes(state.date)) {
    sel.value = state.date;
  }
}

function saveByDate() {
  const dt = $('#work-date').value;
  if (!dt) return say('저장할 날짜를 선택해주세요.', true);
  state.date = dt;
  const payload = {
    date: dt,
    savedAt: formatNowDateTime(),
    departments: state.departments,
    managers: state.managers,
    currentManager: state.currentManager,
    rows: state.rows
  };
  try {
    localStorage.setItem(LS_KEY_DAY_PREFIX + dt, JSON.stringify(payload));
    saveWorkingState();
    refreshSavedDateSelect(dt);
    say(`✓ [${dt}] 일자별 데이터가 저장되었습니다.`);
  } catch (e) {
    say('저장에 실패했습니다.', true);
  }
}

function loadByDate(targetDt) {
  const dt = targetDt || $('#saved-date-select').value;
  if (!dt) return say('불러올 저장 일자가 없습니다.', true);
  try {
    const raw = localStorage.getItem(LS_KEY_DAY_PREFIX + dt);
    if (!raw) return say(`[${dt}] 저장된 데이터가 없습니다.`, true);
    const payload = JSON.parse(raw);
    pushUndo();
    state.date = dt;
    $('#work-date').value = dt;
    updateDateUI();
    if (Array.isArray(payload.departments)) state.departments = payload.departments;
    if (Array.isArray(payload.managers)) state.managers = payload.managers;
    if (payload.currentManager) state.currentManager = payload.currentManager;
    state.rows = Array.isArray(payload.rows) && payload.rows.length ? payload.rows : createDefaultRows(10);
    filterQuery = '';
    $('#search-input').value = '';
    renderDeptAndMgr();
    renderTable();
    saveWorkingState();
    refreshSavedDateSelect(dt);
    say(`✓ [${dt}] 일자별 데이터를 불러왔습니다.`);
  } catch (e) {
    say('데이터를 불러오는 중 오류가 발생했습니다.', true);
  }
}

function deleteByDate() {
  const dt = $('#saved-date-select').value;
  if (!dt) return say('삭제할 저장 일자가 없습니다.', true);
  try {
    localStorage.removeItem(LS_KEY_DAY_PREFIX + dt);
    refreshSavedDateSelect();
    say(`✓ [${dt}] 저장 데이터를 삭제했습니다.`);
  } catch (e) {}
}

/* 관리부서 / 관리자 / 현재 관리자 렌더링 */
function renderDeptAndMgr() {
  const dSel = $('#dept-select');
  dSel.innerHTML = state.departments.length
    ? state.departments.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('')
    : '<option value="">등록된 부서 없음</option>';
  if (state.currentManager.dept && state.departments.includes(state.currentManager.dept)) {
    dSel.value = state.currentManager.dept;
  }

  const mSel = $('#mgr-select');
  mSel.innerHTML = state.managers.length
    ? state.managers.map((m, idx) => {
        const label = [m.dept, m.rank, m.name].filter(Boolean).join(' / ');
        return `<option value="${idx}">${esc(label)}</option>`;
      }).join('')
    : '<option value="">등록된 관리자 없음</option>';

  const matchIdx = state.managers.findIndex(
    m => m.name === state.currentManager.name && m.dept === state.currentManager.dept
  );
  if (matchIdx >= 0) mSel.value = String(matchIdx);

  $('#cur-dept').value = state.currentManager.dept || '';
  $('#cur-rank').value = state.currentManager.rank || '';
  $('#cur-name').value = state.currentManager.name || '';
}

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* 찾기 필터링 로직 */
function getFilteredIndices() {
  const q = filterQuery.trim().toLowerCase();
  if (!q) return state.rows.map((_, idx) => idx);
  const matched = [];
  state.rows.forEach((row, idx) => {
    const roomStr = String(row.room || '').toLowerCase();
    const dongRoomStr = (String(row.dong || '') + String(row.room || '')).toLowerCase();
    const mgrStr = String(row.mgr || '').toLowerCase();
    const deptStr = String(row.dept || '').toLowerCase();
    if (
      roomStr.includes(q) ||
      dongRoomStr.includes(q) ||
      mgrStr.includes(q) ||
      deptStr.includes(q)
    ) {
      matched.push(idx);
    }
  });
  return matched;
}

function autoResizeTextarea(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.max(31, ta.scrollHeight) + 'px';
}

/* 리스트 테이블 렌더링 */
function renderTable() {
  const tbody = $('#list-tbody');
  const indices = getFilteredIndices();
  const isFiltered = filterQuery.trim() !== '';

  const banner = $('#filter-banner');
  if (isFiltered) {
    banner.classList.add('active');
    $('#filter-banner-text').textContent = `찾기 결과 ("${filterQuery.trim()}") : 총 ${indices.length}건이 리스트에 표시됩니다.`;
  } else {
    banner.classList.remove('active');
  }

  if (!indices.length) {
    tbody.innerHTML = `<tr><td colspan="9" style="padding:24px; color:#64748b; font-weight:700;">검색 조건("${esc(filterQuery)}")에 일치하는 리스트가 없습니다. [원래대로] 버튼을 눌러 전체 목록으로 돌아가세요.</td></tr>`;
    $('#row-count-info').textContent = `검색 결과 0건 / 전체 ${state.rows.length}행`;
    return;
  }

  tbody.innerHTML = indices.map((realIdx, viewIdx) => {
    const row = state.rows[realIdx];
    const cellsHtml = COL_KEYS.map((key, cIdx) => {
      const st = (row.styles && row.styles[key]) || {};
      let styleCss = '';
      if (st.bg) styleCss += `background-color:${st.bg};`;
      if (st.color) styleCss += `color:${st.color};`;
      if (st.border) styleCss += `border:${st.border};`;
      const isSel = selectedCell.r === realIdx && selectedCell.c === cIdx;
      const alignCls = CENTER_COLS.has(key) ? 'tc' : 'tl';
      return `<td data-r="${realIdx}" data-c="${cIdx}" data-key="${key}" class="${isSel ? 'selected' : ''}" style="${styleCss}">
        <textarea class="cell-editor ${alignCls}" data-r="${realIdx}" data-c="${cIdx}" data-key="${key}" rows="1">${esc(row[key] || '')}</textarea>
      </td>`;
    }).join('');

    return `<tr data-real-idx="${realIdx}">
      <td class="seq-cell">${viewIdx + 1}</td>
      ${cellsHtml}
      <td class="col-del"><button class="btn-row-del" data-del-idx="${realIdx}" title="이 행 삭제">삭제</button></td>
    </tr>`;
  }).join('');

  $$('#list-tbody textarea.cell-editor').forEach(autoResizeTextarea);
  $('#row-count-info').textContent = isFiltered
    ? `검색 결과 ${indices.length}건 / 전체 ${state.rows.length}행`
    : `총 ${state.rows.length}행`;
}

function updateCellSelectionHighlight() {
  $$('#list-tbody td.selected').forEach(td => td.classList.remove('selected'));
  const td = document.querySelector(`#list-tbody td[data-r="${selectedCell.r}"][data-c="${selectedCell.c}"]`);
  if (td) td.classList.add('selected');
}

/* 내용입력 -> 등록버튼 클릭 시 리스트 자동 등록 및 행 추가 */
function registerEntry() {
  const dong = $('#entry-dong').value.trim();
  const room = $('#entry-room').value.trim();
  const dtText = $('#entry-datetime').value.trim() || formatNowDateTime();
  const consult = $('#entry-consult').value.trim();
  const action = $('#entry-action').value.trim();
  const dept = $('#cur-dept').value.trim();
  const mgr = $('#cur-name').value.trim();

  if (!room && !consult && !action) {
    say('세대번호 또는 상담/조치 내용을 입력하세요.', true);
    $('#entry-room').focus();
    return;
  }

  pushUndo();

  // 등록 시 검색 필터 상태였다면 전체 보기로 복원해 새 등록 항목을 바로 확인
  if (filterQuery) {
    filterQuery = '';
    $('#search-input').value = '';
  }

  const newRecord = {
    dong,
    room,
    dept,
    mgr,
    consult,
    action,
    etc: dtText,
    styles: {}
  };

  // 기본 10행 중 첫 번째 빈 행이 있으면 해당 행에 채우고, 모두 차 있으면 자동으로 새 행을 추가
  const emptyIdx = state.rows.findIndex(r =>
    !r.dong && !r.room && !r.dept && !r.mgr && !r.consult && !r.action && !r.etc
  );

  let targetIdx;
  if (emptyIdx !== -1) {
    state.rows[emptyIdx] = newRecord;
    targetIdx = emptyIdx;
  } else {
    state.rows.push(newRecord);
    targetIdx = state.rows.length - 1;
  }

  // 등록 후 입력칸 공란으로 환원 (날짜/시간은 현재 시각으로 갱신)
  $('#entry-room').value = '';
  $('#entry-consult').value = '';
  $('#entry-action').value = '';
  $('#entry-datetime').value = formatNowDateTime();

  selectedCell = { r: targetIdx, c: 0 };
  renderTable();
  saveWorkingState();
  say(`✓ ${dong ? dong + '동 ' : ''}${room ? room + '호 ' : ''}상담/조치 내용이 등록되었습니다.`);
  $('#entry-room').focus();
}

/* 이벤트 바인딩 */
document.addEventListener('DOMContentLoaded', () => {
  loadWorkingState();

  $('#work-date').value = state.date || getTodayStr();
  updateDateUI();
  refreshSavedDateSelect();
  renderDeptAndMgr();
  $('#entry-datetime').value = formatNowDateTime();
  renderTable();

  // 1분마다 날짜/시간 자동입력 필드 갱신 (사용자가 직접 수정 중이 아닐 때)
  setInterval(() => {
    const dtInput = $('#entry-datetime');
    if (document.activeElement !== dtInput) {
      dtInput.value = formatNowDateTime();
    }
  }, 30000);

  $('#work-date').addEventListener('change', () => {
    updateDateUI();
    saveWorkingState();
  });

  $('#btn-day-save').addEventListener('click', saveByDate);
  $('#btn-day-load').addEventListener('click', () => loadByDate($('#saved-date-select').value));
  $('#btn-day-del').addEventListener('click', deleteByDate);

  // 인쇄 (A4 기본)
  $('#btn-print').addEventListener('click', () => {
    const dt = $('#work-date').value || getTodayStr();
    const mgrInfo = [state.currentManager.dept, state.currentManager.rank, state.currentManager.name].filter(Boolean).join(' ');
    $('#print-meta').textContent = `기준일자: ${dt} | 담당: ${mgrInfo || '-'}`;
    window.print();
  });

  // 관리부서 등록/선택/삭제
  $('#btn-dept-add').addEventListener('click', () => {
    const val = $('#dept-input').value.trim();
    if (!val) return say('등록할 관리부서명을 입력하세요.', true);
    if (!state.departments.includes(val)) {
      pushUndo();
      state.departments.push(val);
    }
    state.currentManager.dept = val;
    $('#dept-input').value = '';
    renderDeptAndMgr();
    saveWorkingState();
    say(`✓ 관리부서 [${val}] 등록 및 선택 완료`);
  });

  $('#dept-select').addEventListener('change', e => {
    state.currentManager.dept = e.target.value;
    $('#cur-dept').value = e.target.value;
    saveWorkingState();
  });

  $('#btn-dept-del').addEventListener('click', () => {
    const val = $('#dept-select').value;
    if (!val) return;
    pushUndo();
    state.departments = state.departments.filter(d => d !== val);
    if (state.currentManager.dept === val) {
      state.currentManager.dept = state.departments[0] || '';
    }
    renderDeptAndMgr();
    saveWorkingState();
    say(`✓ 관리부서 [${val}] 삭제 완료`);
  });

  // 관리자 등록/선택/삭제
  $('#btn-mgr-add').addEventListener('click', () => {
    const dept = $('#dept-select').value || $('#cur-dept').value.trim();
    const rank = $('#mgr-rank-input').value.trim();
    const name = $('#mgr-name-input').value.trim();
    if (!name) return say('등록할 관리자 이름을 입력하세요.', true);
    pushUndo();
    state.managers.push({ dept, rank, name });
    state.currentManager = { dept, rank, name };
    $('#mgr-rank-input').value = '';
    $('#mgr-name-input').value = '';
    renderDeptAndMgr();
    saveWorkingState();
    say(`✓ 관리자 [${name}] 등록 및 현재 관리자로 적용 완료`);
  });

  $('#mgr-select').addEventListener('change', e => {
    const idx = Number(e.target.value);
    const m = state.managers[idx];
    if (!m) return;
    state.currentManager = { dept: m.dept || '', rank: m.rank || '', name: m.name || '' };
    renderDeptAndMgr();
    saveWorkingState();
  });

  $('#btn-mgr-del').addEventListener('click', () => {
    const idx = Number($('#mgr-select').value);
    if (isNaN(idx) || !state.managers[idx]) return;
    pushUndo();
    const removed = state.managers.splice(idx, 1)[0];
    renderDeptAndMgr();
    saveWorkingState();
    say(`✓ 관리자 [${removed.name}] 삭제 완료`);
  });

  // 현재 관리자 직접 수정 동기화
  ['cur-dept', 'cur-rank', 'cur-name'].forEach(id => {
    $('#' + id).addEventListener('input', () => {
      state.currentManager.dept = $('#cur-dept').value;
      state.currentManager.rank = $('#cur-rank').value;
      state.currentManager.name = $('#cur-name').value;
      saveWorkingState();
    });
  });

  // 내용입력 등록
  $('#btn-entry-register').addEventListener('click', registerEntry);

  // 행 추가 버튼 별도 동작
  $('#btn-add-row').addEventListener('click', () => {
    pushUndo();
    state.rows.push(createEmptyRow());
    const newIdx = state.rows.length - 1;
    selectedCell = { r: newIdx, c: 0 };
    renderTable();
    saveWorkingState();
    const firstCell = document.querySelector(`#list-tbody textarea[data-r="${newIdx}"][data-c="0"]`);
    if (firstCell) firstCell.focus();
    say(`✓ 새 행이 추가되었습니다. (총 ${state.rows.length}행)`);
  });

  // 찾기 기능 & 원래대로 버튼
  function runSearch() {
    filterQuery = $('#search-input').value;
    renderTable();
    const cnt = getFilteredIndices().length;
    if (filterQuery.trim()) {
      say(`✓ "${filterQuery.trim()}" 검색 결과 ${cnt}건이 표에 표시됩니다.`);
    } else {
      say('전체 리스트가 표시됩니다.');
    }
  }

  function resetSearch() {
    filterQuery = '';
    $('#search-input').value = '';
    renderTable();
    say('✓ 원래대로 전체 리스트 상태로 환원되었습니다.');
  }

  $('#btn-find').addEventListener('click', runSearch);
  $('#search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      runSearch();
    }
  });
  $('#btn-reset-view').addEventListener('click', resetSearch);
  $('#btn-banner-reset').addEventListener('click', resetSearch);

  // 서식 도구 (채우기, 글자색, 테두리)
  function applyStyleToSelected(prop, val) {
    const row = state.rows[selectedCell.r];
    const key = COL_KEYS[selectedCell.c];
    if (!row || !key) return;
    pushUndo();
    row.styles = row.styles || {};
    row.styles[key] = row.styles[key] || {};
    if (val === '' || val === 'none') {
      delete row.styles[key][prop];
    } else {
      row.styles[key][prop] = val;
    }
    renderTable();
    saveWorkingState();
  }

  $('#btn-fill-apply').addEventListener('click', () => applyStyleToSelected('bg', $('#fill-color').value));
  $('#btn-fill-clear').addEventListener('click', () => applyStyleToSelected('bg', ''));
  $('#btn-font-apply').addEventListener('click', () => applyStyleToSelected('color', $('#font-color').value));
  $('#btn-border-apply').addEventListener('click', () => applyStyleToSelected('border', $('#border-style').value));

  // 실행취소
  $('#btn-undo').addEventListener('click', () => {
    if (!undoStack.length) return say('되돌릴 작업 내역이 없습니다.', true);
    const prev = JSON.parse(undoStack.pop());
    state.rows = prev.rows;
    state.departments = prev.departments;
    state.managers = prev.managers;
    state.currentManager = prev.currentManager;
    renderDeptAndMgr();
    renderTable();
    saveWorkingState();
    say('✓ 실행취소가 완료되었습니다.');
  });

  // 리스트 테이블 입력 / 선택 / 삭제 이벤트 위임
  const tbody = $('#list-tbody');

  tbody.addEventListener('focusin', e => {
    const ta = e.target.closest('textarea.cell-editor');
    if (!ta) return;
    selectedCell = { r: Number(ta.dataset.r), c: Number(ta.dataset.c) };
    updateCellSelectionHighlight();
  });

  tbody.addEventListener('input', e => {
    const ta = e.target.closest('textarea.cell-editor');
    if (!ta) return;
    const r = Number(ta.dataset.r);
    const key = ta.dataset.key;
    if (state.rows[r]) {
      state.rows[r][key] = ta.value;
      autoResizeTextarea(ta);
      saveWorkingState();
    }
  });

  tbody.addEventListener('click', e => {
    const delBtn = e.target.closest('button[data-del-idx]');
    if (!delBtn) return;
    const idx = Number(delBtn.dataset.delIdx);
    pushUndo();
    state.rows.splice(idx, 1);
    if (state.rows.length === 0) {
      state.rows.push(createEmptyRow());
    }
    if (selectedCell.r >= state.rows.length) {
      selectedCell.r = state.rows.length - 1;
    }
    renderTable();
    saveWorkingState();
    say('✓ 선택한 행이 삭제되었습니다.');
  });

  /* 모든 셀(상단 입력폼 + 리스트 표 전체) Enter 및 화살표 키 입력/이동 지원 */
  document.addEventListener('keydown', e => {
    const el = e.target;
    if (!el || !['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)) return;
    if (el.id === 'search-input') return; // 검색창은 Enter 시 검색 실행

    const isSheetCell = el.classList.contains('cell-editor');
    const isTextarea = el.tagName === 'TEXTAREA';
    const key = e.key;

    // Alt + Enter: textarea 내 줄바꿈
    if (key === 'Enter' && e.altKey && isTextarea) {
      e.preventDefault();
      const start = el.selectionStart;
      const end = el.selectionEnd;
      el.value = el.value.substring(0, start) + '\n' + el.value.substring(end);
      el.selectionStart = el.selectionEnd = start + 1;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }

    if (e.isComposing) return;

    // 1) 하단 리스트 스프레드시트 셀 내 엔터/화살표 이동
    if (isSheetCell) {
      const r = Number(el.dataset.r);
      const c = Number(el.dataset.c);
      const visibleRows = [...tbody.querySelectorAll('tr[data-real-idx]')];
      const viewRowIdx = visibleRows.findIndex(tr => Number(tr.dataset.realIdx) === r);

      let dRow = 0;
      let dCol = 0;

      if (key === 'Enter') {
        dRow = e.shiftKey ? -1 : 1;
      } else if (key === 'ArrowDown') {
        if (!isTextarea || el.selectionEnd === el.value.length) dRow = 1;
      } else if (key === 'ArrowUp') {
        if (!isTextarea || el.selectionStart === 0) dRow = -1;
      } else if (key === 'ArrowLeft') {
        if (el.selectionStart === 0 && el.selectionEnd === 0) dCol = -1;
      } else if (key === 'ArrowRight') {
        if (el.selectionStart === el.value.length && el.selectionEnd === el.value.length) dCol = 1;
      }

      if (dRow !== 0 || dCol !== 0) {
        e.preventDefault();
        let nextViewRow = viewRowIdx + dRow;
        let nextCol = c + dCol;

        // 마지막 행에서 Enter 누르면 자동으로 새 행 추가 후 이동
        if (dRow === 1 && nextViewRow >= visibleRows.length && !filterQuery.trim()) {
          pushUndo();
          state.rows.push(createEmptyRow());
          const addedIdx = state.rows.length - 1;
          selectedCell = { r: addedIdx, c: nextCol };
          renderTable();
          saveWorkingState();
          const target = tbody.querySelector(`textarea[data-r="${addedIdx}"][data-c="${nextCol}"]`);
          if (target) { target.focus(); target.select(); }
          return;
        }

        if (nextViewRow >= 0 && nextViewRow < visibleRows.length && nextCol >= 0 && nextCol < COL_KEYS.length) {
          const targetRealR = Number(visibleRows[nextViewRow].dataset.realIdx);
          const target = tbody.querySelector(`textarea[data-r="${targetRealR}"][data-c="${nextCol}"]`);
          if (target) {
            target.focus();
            target.select();
          }
        }
      }
      return;
    }

    // 2) 상단 입력 폼 셀들 간 Enter / 화살표 이동
    const navFields = $$('input[data-nav], select[data-nav], textarea[data-nav]');
    const idx = navFields.indexOf(el);
    if (idx === -1) return;

    if (key === 'Enter') {
      // 등록 버튼이나 추가 버튼 위에서 Enter 누르면 클릭 실행
      if (el.tagName === 'BUTTON') return;
      e.preventDefault();
      const next = navFields[idx + (e.shiftKey ? -1 : 1)];
      if (next) {
        next.focus();
        if (next.select) next.select();
      } else {
        // 내용입력 마지막 칸에서 Enter 시 리스트 첫 셀로 이동
        const firstCell = tbody.querySelector('textarea.cell-editor');
        if (firstCell) { firstCell.focus(); firstCell.select(); }
      }
    } else if (key === 'ArrowDown') {
      if (!isTextarea || el.selectionEnd === el.value.length) {
        e.preventDefault();
        const next = navFields[idx + 1] || tbody.querySelector('textarea.cell-editor');
        if (next) { next.focus(); if (next.select) next.select(); }
      }
    } else if (key === 'ArrowUp') {
      if (!isTextarea || el.selectionStart === 0) {
        e.preventDefault();
        const prev = navFields[idx - 1];
        if (prev) { prev.focus(); if (prev.select) prev.select(); }
      }
    } else if (key === 'ArrowRight' && el.tagName !== 'SELECT') {
      if (el.selectionStart === el.value.length && el.selectionEnd === el.value.length) {
        e.preventDefault();
        const next = navFields[idx + 1];
        if (next) { next.focus(); if (next.select) next.select(); }
      }
    } else if (key === 'ArrowLeft' && el.tagName !== 'SELECT') {
      if (el.selectionStart === 0 && el.selectionEnd === 0) {
        e.preventDefault();
        const prev = navFields[idx - 1];
        if (prev) { prev.focus(); if (prev.select) prev.select(); }
      }
    }
  });
});
</script>
</body>
</html>
